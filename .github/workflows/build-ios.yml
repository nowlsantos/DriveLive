name: Build DriveLive iOS Framework

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    name: Link iOS Kotlin Multiplatform Framework
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 21

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Setup Gradle caching
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Create stub local.properties for CI
        run: |
          echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" >> local.properties

      - name: Link iOS Simulator Arm64 Framework
        run: ./gradlew :shared:linkDebugFrameworkIosSimulatorArm64 --stacktrace

      - name: Link iOS Device Arm64 Framework
        run: ./gradlew :shared:linkDebugFrameworkIosArm64 --stacktrace

      - name: Upload compiled iOS Framework artifact
        uses: actions/upload-artifact@v4
        with:
          name: DriveLive-shared-ios-framework
          path: shared/build/bin/iosSimulatorArm64/debugFramework/
          retention-days: 5